<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Mahee ❤️</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="scene">


    <!-- Spider Web Corners -->

    <div class="web web-left"></div>
    <div class="web web-right"></div>

    <div class="spider">
    🕷️
    </div>

    <!-- Hanging Spider-Man Inspired Character -->

    <div class="spiderman">

        <div class="thread"></div>


        <div class="mask">

            <div class="eye left-eye"></div>

            <div class="eye right-eye"></div>

        </div>


        <div class="suit"></div>


    </div>




    <!-- Birthday Message -->

    <div class="message">

        <h1>
            Happiest Birthday
        </h1>


        <h2>
            My Loveliest Person
        </h2>


        <h3>
            Mahee ❤️
        </h3>


        <p id="typing"></p>


    </div>

    <div class="corner-quote">

    Among millions of stars... ✨<br>
    you are my favourite universe. 🌙<br>
    Every journey feels magical<br>
    because I found you. 🕸️❤️

</div>



    <!-- Music Button -->

    <button id="musicBtn">
        🎵 Play Theme
    </button>



</div>




<audio id="music">

    <source src="music/spiderman.mp3" type="audio/mpeg">

</audio>




<script src="script.js"></script>


</body>

</html>
