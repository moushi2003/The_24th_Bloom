<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Mahee ❤️</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ================= SPIDER PAGE ================= -->


<div class="scene">


    <div class="web web-left"></div>
    <div class="web web-right"></div>


    <div class="spider">
        🕷️
    </div>



    <div class="spiderman">

        <div class="thread"></div>


        <div class="mask">

            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>

        </div>


        <div class="suit"></div>

    </div>



    <div class="message">

        <h1>
            Happiest Birthday
        </h1>


        <h2>
            My Loveliest Person
        </h2>


        <h3>
            Mahee ❤️
        </h3>


        <p id="typing"></p>

    </div>



    <button id="musicBtn">
        🎵 Play Theme
    </button>


</div>



<audio id="music">

    <source src="music/spiderman.mp3" type="audio/mpeg">

</audio>

<!-- ================= CAKE PAGE ================= -->

<section class="cake-page">


    <!-- Curtain Background -->

    <div class="curtain left-curtain"></div>
    <div class="curtain right-curtain"></div>



    <!-- Balloons -->

    <div class="balloon balloon1">🎈</div>
    <div class="balloon balloon2">🎈</div>
    <div class="balloon balloon3">🎈</div>
    <div class="balloon balloon4">🎈</div>



    <!-- Spotlight -->

    <div class="spotlight"></div>



    <!-- Birthday Text -->

    <div class="cake-title">

        Happy 24th Birthday ❤️

        <br>

        Mahee

    </div>



    <!-- Cake -->

    <div class="cake">


        <div class="layer top-layer">

            <div class="candles">

                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>

                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>

                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>

                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>
                <div class="candle"><span></span></div>


            </div>

        </div>



        <div class="layer middle-layer"></div>

        <div class="layer bottom-layer"></div>



    </div>



    <button id="blowBtn">
        💨 Make a Wish
    </button>



    <button id="nextBtn">
        Next 💌
    </button>



</section>

<script src="script.js"></script>


</body>

</html>
