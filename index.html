<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC DOCUMENT SETTINGS
    ===================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080b24"
    >

    <meta
        name="description"
        content="A cinematic birthday experience made with love."
    >


    <!-- =====================================================
         PAGE TITLE
    ===================================================== -->

    <title>For My Mahee 🤍</title>


    <!-- =====================================================
         GOOGLE FONTS
    ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         MAIN CSS
    ===================================================== -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================================
         GLOBAL CINEMATIC PARTICLE LAYERS
         ===================================================== -->

    <div class="global-particles" id="globalParticles"></div>

    <div class="global-sparkles" id="globalSparkles"></div>


    <!-- =====================================================
         PAGE 1
         CINEMATIC BIRTHDAY
         ===================================================== -->

    <main id="mainExperience">


        <section
            class="birthday-page active-page"
            id="birthdayPage"
        >


            <!-- =================================================
                 CINEMATIC BACKGROUND
                 ================================================= -->

            <div
                class="birthday-background"
                aria-hidden="true"
            >

                <div class="birthday-bg-layer bg-layer-one"></div>

                <div class="birthday-bg-layer bg-layer-two"></div>

                <div class="birthday-bg-layer bg-layer-three"></div>

                <div class="birthday-stars"></div>

                <div class="birthday-bg-particles"></div>

                <div class="birthday-light-rays"></div>

            </div>


            <!-- =================================================
                 BACKGROUND BALLOONS
                 They become visible after curtain opens
                 ================================================= -->

            <div
                class="background-balloons"
                id="backgroundBalloons"
                aria-hidden="true"
            >

                <span class="bg-balloon balloon-1">🎈</span>

                <span class="bg-balloon balloon-2">🎈</span>

                <span class="bg-balloon balloon-3">🎈</span>

                <span class="bg-balloon balloon-4">🎈</span>

                <span class="bg-balloon balloon-5">🎈</span>

                <span class="bg-balloon balloon-6">🎈</span>

                <span class="bg-balloon balloon-7">🎈</span>

                <span class="bg-balloon balloon-8">🎈</span>

            </div>


            <!-- =================================================
                 CINEMATIC CURTAIN
                 ================================================= -->

            <div
                class="birthday-curtain"
                id="birthdayCurtain"
                aria-hidden="true"
            >


                <!-- LEFT CURTAIN -->

                <div
                    class="curtain-panel curtain-left"
                >

                    <div class="curtain-folds"></div>

                    <div class="curtain-shine"></div>

                </div>


                <!-- RIGHT CURTAIN -->

                <div
                    class="curtain-panel curtain-right"
                >

                    <div class="curtain-folds"></div>

                    <div class="curtain-shine"></div>

                </div>


                <!-- LIGHT BEHIND CURTAIN -->

                <div class="curtain-center-light"></div>


            </div>


            <!-- =================================================
                 MAIN BIRTHDAY CONTENT
                 ================================================= -->

            <div
                class="birthday-content"
                id="birthdayContent"
            >


                <!-- =============================================
                     HERO SCENE
                     ============================================= -->

                <div
                    class="birthday-hero"
                    id="birthdayHero"
                >


                    <!-- HERO SPOTLIGHT -->

                    <div
                        class="hero-spotlight"
                        aria-hidden="true"
                    ></div>


                    <!-- HERO GLOW -->

                    <div
                        class="hero-glow"
                        aria-hidden="true"
                    ></div>


                    <!-- =========================================
                         CAKE + CALENDAR WILL COME IN PART 2
                         ========================================= -->

                 <!-- =========================================================
     BIRTHDAY HERO CONTENT
     HTML PART 2
     ========================================================= -->


<!-- =====================================================
     CINEMATIC BIRTHDAY TITLE
     ===================================================== -->

<div class="birthday-title">

    <p class="birthday-kicker">
        A Little Celebration For You
    </p>

    <h1 class="birthday-main-title">
        Happy 24th Birthday
    </h1>

    <h2 class="birthday-name">
        Mahee 🤍
    </h2>

</div>


<!-- =====================================================
     GLASS CALENDAR
     FLOATING ABOVE THE CAKE
     ===================================================== -->

<div
    class="birthday-calendar"
    id="birthdayCalendar"
>

    <!-- Glass glow -->
    <div
        class="calendar-glow"
        aria-hidden="true"
    ></div>


    <!-- Glass reflection -->
    <div
        class="calendar-reflection"
        aria-hidden="true"
    ></div>


    <div class="calendar-inner">


        <!-- =============================================
             CUTE BIRTHDAY MESSAGE
             ============================================= -->

        <div class="calendar-message">

            <span>
                My Little LEO's
            </span>

            <strong>
                Birth Month is Here ✨
            </strong>

        </div>


        <!-- =============================================
             MONTH
             ============================================= -->

        <div class="calendar-month">

            <span class="calendar-month-name">
                AUGUST
            </span>

            <span class="calendar-year">
                2026
            </span>

        </div>


        <!-- =============================================
             WEEK DAYS
             ============================================= -->

        <div class="calendar-weekdays">

            <span>Sun</span>
            <span>Mon</span>
            <span>Tue</span>
            <span>Wed</span>
            <span>Thu</span>
            <span>Fri</span>
            <span>Sat</span>

        </div>


        <!-- =============================================
             CALENDAR DATES
             ============================================= -->

        <div class="calendar-days">


            <!-- First Row -->

            <span class="empty-day"></span>
            <span class="empty-day"></span>
            <span class="empty-day"></span>
            <span class="empty-day"></span>
            <span class="empty-day"></span>

            <span>1</span>
            <span>2</span>


            <!-- Second Row -->

            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>


            <!-- Third Row -->

            <span>10</span>
            <span>11</span>
            <span>12</span>
            <span>13</span>
            <span>14</span>
            <span>15</span>
            <span>16</span>


            <!-- =========================================
                 BIRTHDAY DATE
                 ========================================= -->

            <span
                class="birthday-date"
                id="birthdayDate"
            >

                <span class="date-number">
                    17
                </span>

                <span class="date-heart">
                    ♥
                </span>

            </span>


            <!-- Fourth Row -->

            <span>18</span>
            <span>19</span>
            <span>20</span>
            <span>21</span>
            <span>22</span>
            <span>23</span>


            <!-- Fifth Row -->

            <span>24</span>
            <span>25</span>
            <span>26</span>
            <span>27</span>
            <span>28</span>
            <span>29</span>
            <span>30</span>


            <!-- Sixth Row -->

            <span>31</span>

        </div>


    </div>

</div>


<!-- =====================================================
     THREE-TIER BIRTHDAY CAKE
     ===================================================== -->

<div
    class="birthday-cake"
    id="birthdayCake"
>


    <!-- =============================================
         CAKE AURA
         ============================================= -->

    <div
        class="cake-aura"
        aria-hidden="true"
    ></div>


    <!-- =============================================
         CANDLE FLAMES
         ============================================= -->

    <div class="cake-candles">


        <div class="cake-candle candle-left">

            <span class="candle-flame"></span>

        </div>


        <div class="cake-candle candle-center">

            <span class="candle-flame"></span>

        </div>


        <div class="cake-candle candle-right">

            <span class="candle-flame"></span>

        </div>


    </div>


    <!-- =============================================
         TOP TIER
         SMALLEST
         ============================================= -->

    <div class="cake-tier cake-tier-top">

        <div class="cake-top-surface"></div>

        <div class="cake-frosting">

            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

        <div class="cake-decoration">

            <i></i>
            <i></i>
            <i></i>

        </div>

    </div>


    <!-- =============================================
         MIDDLE TIER
         MEDIUM
         ============================================= -->

    <div class="cake-tier cake-tier-middle">

        <div class="cake-top-surface"></div>

        <div class="cake-frosting">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

        <div class="cake-decoration">

            <i></i>
            <i></i>
            <i></i>
            <i></i>

        </div>

    </div>


    <!-- =============================================
         BOTTOM TIER
         LARGEST
         ============================================= -->

    <div class="cake-tier cake-tier-bottom">

        <div class="cake-top-surface"></div>

        <div class="cake-frosting">

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>

        <div class="cake-decoration">

            <i></i>
            <i></i>
            <i></i>
            <i></i>
            <i></i>

        </div>

    </div>


    <!-- =============================================
         CAKE PLATE
         ============================================= -->

    <div class="cake-plate">

        <div class="cake-plate-glow"></div>

    </div>


</div>


        </section>


    </main>


    <!-- =====================================================
         MAIN JAVASCRIPT
         ===================================================== -->

    <script src="script.js"></script>

</body>

</html>
