<!DOCTYPE html>
<html lang="en">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For My Mahee ❤️</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ================= SPIDER PAGE ================= -->


<div class="scene">


    <div class="web web-left"></div>
    <div class="web web-right"></div>


    <div class="spider">
        🕷️
    </div>



    <div class="spiderman">

        <div class="thread"></div>


        <div class="mask">

            <div class="eye left-eye"></div>
            <div class="eye right-eye"></div>

        </div>


        <div class="suit"></div>

    </div>



    <div class="message">

        <h1>
            Happiest Birthday
        </h1>


        <h2>
            My Loveliest Person
        </h2>


        <h3>
            Mahee ❤️
        </h3>


        <p id="typing"></p>

    </div>



    <button id="musicBtn">
        🎵 Play Theme
    </button>


</div>



<audio id="music">

    <source src="music/spiderman.mp3" type="audio/mpeg">

</audio>


<script src="script.js"></script>


</body>

</html>
